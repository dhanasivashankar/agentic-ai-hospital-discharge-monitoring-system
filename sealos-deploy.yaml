apiVersion: apps/v1
kind: Deployment
metadata:
  name: hospital-monitoring-backend
  labels:
    app: hospital-monitoring-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hospital-monitoring-backend
  template:
    metadata:
      labels:
        app: hospital-monitoring-backend
    spec:
      containers:
        - name: backend
          # In Sealos App Launchpad, this is automatically set to your built container
          image: hospital-monitoring-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: PORT
              value: "8000"
            - name: MONGODB_URI
              value: "mongodb+srv://admin:HospitalSecure123@cluster0.9btwz77.mongodb.net/?appName=Cluster0"
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "2048Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: hospital-monitoring-backend-service
  labels:
    app: hospital-monitoring-backend
spec:
  ports:
    - port: 8000
      targetPort: 8000
      name: http
  selector:
    app: hospital-monitoring-backend
  type: ClusterIP
